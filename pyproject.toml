[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openomicsbench"
version = "0.1.0.dev0"
description = "Traceable transcriptomics test data and deterministic validation"
keywords = ["bioinformatics", "genomics", "transcriptomics", "rna-seq", "benchmarking", "reproducibility", "data-validation", "data-provenance", "scientific-workflows", "research-software"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13,<3", "numpy>=2.3,<3"]

[project.scripts]
omicsbench = "omicsbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
