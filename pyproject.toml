[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openomicsbench"
version = "1.0.0"
description = "Curated bulk RNA-seq benchmarks with traceable data and deterministic validation"
license = "Apache-2.0"
keywords = ["bioinformatics", "computational-biology", "genomics", "transcriptomics", "bulk-rna-seq", "gene-expression", "differential-expression", "benchmarking", "benchmark-data", "test-data", "data-validation", "data-provenance", "data-integrity", "reproducibility", "scientific-workflows", "research-software", "expression-atlas", "ensembl", "deseq2"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13,<3", "numpy>=2.3,<3"]

[project.scripts]
omicsbench = "omicsbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
