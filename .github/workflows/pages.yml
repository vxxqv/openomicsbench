name: Publish project site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p build/pages
          cp site/index.html site/rnaseq.html site/assess.html site/styles.css site/rnaseq.css site/app.js site/collection.js build/pages/
          cp catalog/collection.json build/pages/collection.json
      - name: Add optional website analytics
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: python scripts/insert_site_analytics.py build/pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages
      - id: deployment
        uses: actions/deploy-pages@v4
