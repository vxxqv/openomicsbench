name: Publish Python package

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Install tested dependencies
        run: |
          python -m pip install -r requirements-tested.txt
          python -m pip install --no-deps -e .
      - name: Check tag and package version
        run: test "v$(python -c 'import omicsbench; print(omicsbench.__version__)')" = "$GITHUB_REF_NAME"
      - name: Test source tree
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_repository.py
          python scripts/certify_release.py --preflight
      - name: Build distributions
        working-directory: /tmp
        run: python -m build --outdir "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE"
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Test installed wheel
        run: |
          python -m venv --system-site-packages /tmp/openomicsbench-smoke
          /tmp/openomicsbench-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/openomicsbench-smoke/bin/omicsbench list --assay bulk_rna_seq
          /tmp/openomicsbench-smoke/bin/omicsbench list --assay sequence_dna
          /tmp/openomicsbench-smoke/bin/omicsbench list --assay single_cell_rna_seq
          /tmp/openomicsbench-smoke/bin/omicsbench list --assay chromatin_accessibility
          /tmp/openomicsbench-smoke/bin/omicsbench validate rnaseq-002
          /tmp/openomicsbench-smoke/bin/omicsbench validate sequence-004
          /tmp/openomicsbench-smoke/bin/omicsbench suite validate --id rnaseq-002 --id sequence-004 --junit /tmp/openomicsbench-suite.xml
          /tmp/openomicsbench-smoke/bin/omicsbench assay info whole-genome
          sequence=$(/tmp/openomicsbench-smoke/bin/python -c 'from omicsbench.registry import default_root; print(default_root() / "datasets/sequences/sequence-001/nano/sequences.fasta")')
          /tmp/openomicsbench-smoke/bin/omicsbench seq qc "$sequence" --molecule dna
          reference=$(/tmp/openomicsbench-smoke/bin/python -c 'from omicsbench.registry import default_root; print(default_root() / "datasets/rnaseq/rnaseq-002/expected/reference-effects.tsv.gz")')
          peptides=$(/tmp/openomicsbench-smoke/bin/python -c 'from omicsbench.registry import default_root; print(default_root() / "datasets/sequences/sequence-006/expected/peptides.tsv")')
          cell_labels=$(/tmp/openomicsbench-smoke/bin/python -c 'from omicsbench.registry import default_root; print(default_root() / "datasets/singlecell/singlecell-001/expected/cell-labels.tsv")')
          peak_truth=$(/tmp/openomicsbench-smoke/bin/python -c 'from omicsbench.registry import default_root; print(default_root() / "datasets/intervals/interval-001/expected/truth-peaks.narrowPeak")')
          chrom_sizes=$(/tmp/openomicsbench-smoke/bin/python -c 'from omicsbench.registry import default_root; print(default_root() / "datasets/intervals/interval-001/nano/chrom.sizes")')
          /tmp/openomicsbench-smoke/bin/omicsbench compare rnaseq-002 "$reference"
          mkdir /tmp/openomicsbench-results
          cp "$reference" /tmp/openomicsbench-results/rnaseq-002.tsv.gz
          /tmp/openomicsbench-smoke/bin/omicsbench suite compare /tmp/openomicsbench-results --id rnaseq-002 --junit /tmp/openomicsbench-comparison.xml
          mkdir /tmp/openomicsbench-results-copy
          cp "$reference" /tmp/openomicsbench-results-copy/rnaseq-002.tsv.gz
          /tmp/openomicsbench-smoke/bin/omicsbench suite matrix --method first=/tmp/openomicsbench-results --method second=/tmp/openomicsbench-results-copy --id rnaseq-002 --json /tmp/openomicsbench-matrix.json --html /tmp/openomicsbench-matrix.html
          /tmp/openomicsbench-smoke/bin/omicsbench suite regress /tmp/openomicsbench-matrix.json /tmp/openomicsbench-matrix.json --junit /tmp/openomicsbench-regression.xml
          /tmp/openomicsbench-smoke/bin/omicsbench bundle create /tmp/openomicsbench-selected.zip --id rnaseq-002 --id sequence-005
          /tmp/openomicsbench-smoke/bin/omicsbench bundle verify /tmp/openomicsbench-selected.zip
          mkdir /tmp/openomicsbench-mixed
          cp "$reference" /tmp/openomicsbench-mixed/rnaseq-002.tsv.gz
          cp "$peptides" /tmp/openomicsbench-mixed/sequence-006.peptides.tsv
          cp "$cell_labels" /tmp/openomicsbench-mixed/singlecell-001.cells.tsv
          cp "$peak_truth" /tmp/openomicsbench-mixed/interval-001.narrowPeak
          printf '##fileformat=VCFv4.3\n#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\nsynthetic_reference\t150\t.\tC\tA\t60\tPASS\t.\nsynthetic_reference\t500\t.\tA\tC\t60\tPASS\t.\nsynthetic_reference\t850\t.\tC\tA\t60\tPASS\t.\n' > /tmp/openomicsbench-mixed/sequence-005.vcf
          printf '%s\n' '{"schema_version":"1.0","name":"wheel smoke","version":"5.0.0","runtime_seconds":1.0,"peak_memory_mb":64.0,"threads":1}' > /tmp/openomicsbench-mixed/method.json
          /tmp/openomicsbench-smoke/bin/omicsbench variant compare sequence-005 /tmp/openomicsbench-mixed/sequence-005.vcf
          /tmp/openomicsbench-smoke/bin/omicsbench peptide compare sequence-006 /tmp/openomicsbench-mixed/sequence-006.peptides.tsv
          /tmp/openomicsbench-smoke/bin/omicsbench cell compare singlecell-001 /tmp/openomicsbench-mixed/singlecell-001.cells.tsv
          /tmp/openomicsbench-smoke/bin/omicsbench interval qc "$peak_truth" --chrom-sizes "$chrom_sizes"
          /tmp/openomicsbench-smoke/bin/omicsbench interval compare interval-001 /tmp/openomicsbench-mixed/interval-001.narrowPeak
          /tmp/openomicsbench-smoke/bin/omicsbench suite index /tmp/openomicsbench-mixed --result rnaseq-002=rnaseq-002.tsv.gz --result singlecell-001=singlecell-001.cells.tsv --result interval-001=interval-001.narrowPeak --result sequence-005=sequence-005.vcf --result sequence-006=sequence-006.peptides.tsv
          /tmp/openomicsbench-smoke/bin/omicsbench suite evaluate /tmp/openomicsbench-mixed --id rnaseq-002 --id singlecell-001 --id interval-001 --id sequence-005 --id sequence-006 --json /tmp/openomicsbench-evaluate.json --html /tmp/openomicsbench-evaluate.html --evidence /tmp/openomicsbench-evidence.zip
          printf '%s\n' '{"schema_version":"1.0","name":"wheel gate","required_benchmarks":["rnaseq-002","singlecell-001","interval-001","sequence-005","sequence-006"],"minimum_pass_rate":1.0,"require_method_receipt":true,"maximum_runtime_seconds":2.0,"maximum_peak_memory_mb":128.0}' > /tmp/openomicsbench-policy.json
          /tmp/openomicsbench-smoke/bin/omicsbench suite gate /tmp/openomicsbench-evaluate.json /tmp/openomicsbench-policy.json --json /tmp/openomicsbench-gate.json
          /tmp/openomicsbench-smoke/bin/omicsbench suite trend --run first=/tmp/openomicsbench-evaluate.json --run second=/tmp/openomicsbench-evaluate.json --html /tmp/openomicsbench-trend.html
          /tmp/openomicsbench-smoke/bin/omicsbench evidence verify /tmp/openomicsbench-evidence.zip
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
