name: Core integrity
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  nano:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: pip install -r requirements-tested.txt
      - run: pip install --no-deps -e .
      - run: python workflows/build_fixture.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_catalog.py
      - run: git diff --exit-code -- catalog figures/v1-fidelity.svg
      - run: python scripts/audit_collection.py
      - run: python scripts/check_repository.py
      - run: python scripts/certify_release.py --preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-validation
          path: build/
